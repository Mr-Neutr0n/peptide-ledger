name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify
        run: ./verify
